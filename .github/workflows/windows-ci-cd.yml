name: Windows CI/CD Pipeline

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore WeatherApiDemo.sln

    - name: Build solution
      run: dotnet build WeatherApiDemo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test WeatherApiDemo.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger trx

    - name: Publish test results
      uses: dorny/test-reporter@v1.9.1
      if: success() || failure()
      with:
        name: Test Results
        path: './TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Generate version
      id: version
      run: |
        $version = "1.0.${{ github.run_number }}"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Generated version: $version"

    - name: Publish application
      run: dotnet publish src/WeatherApi/WeatherApi.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ steps.version.outputs.version }}
        path: ./publish/
        retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: app-${{ needs.build.outputs.version }}
        path: ./deploy

    - name: Deploy to Staging
      run: |
        Write-Host "🚀 Deploying version ${{ needs.build.outputs.version }} to Staging"
        Write-Host "📁 Application files:"
        Get-ChildItem -Path ./deploy -Recurse | Select-Object Name, Length | Format-Table
        Write-Host "✅ Staging deployment completed successfully!"

  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: windows-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    environment: production
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: app-${{ needs.build.outputs.version }}
        path: ./deploy

    - name: Deploy to Production
      run: |
        Write-Host "🚀 Deploying version ${{ needs.build.outputs.version }} to Production"
        Write-Host "📁 Application files:"
        Get-ChildItem -Path ./deploy -Recurse | Select-Object Name, Length | Format-Table
        Write-Host "✅ Production deployment completed successfully!"

  deploy-manual:
    name: Manual Deploy to ${{ github.event.inputs.environment }}
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment != ''
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: app-${{ needs.build.outputs.version }}
        path: ./deploy

    - name: Deploy to ${{ github.event.inputs.environment }}
      run: |
        Write-Host "🚀 Manual deployment of version ${{ needs.build.outputs.version }} to ${{ github.event.inputs.environment }}"
        Write-Host "📁 Application files:"
        Get-ChildItem -Path ./deploy -Recurse | Select-Object Name, Length | Format-Table
        Write-Host "✅ Manual deployment to ${{ github.event.inputs.environment }} completed successfully!"