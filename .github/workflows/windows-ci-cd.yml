name: Windows CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: './WeatherApiDemo.sln'
  BUILD_CONFIGURATION: 'Release'
  ARTIFACT_NAME: 'weather-api-artifacts'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    strategy:
      matrix:
        environment: [staging, production]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore and Build
      run: |
        dotnet restore ${{ env.SOLUTION_PATH }}
        dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run All Tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory TestResults

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test Results (${{ matrix.environment }})
        path: 'TestResults/**/*.trx'
        reporter: dotnet-trx

    - name: Create Deployment Package
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      run: dotnet publish src/WeatherApi/WeatherApi.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish/${{ matrix.environment }}

    - name: Upload Artifacts
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-${{ matrix.environment }}
        path: ./publish/${{ matrix.environment }}
        retention-days: 30

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: build-and-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-${{ matrix.environment }}
        path: ./deploy

    - name: Deploy Application
      run: |
        Write-Host "🚀 Deploying to ${{ matrix.environment }} environment"
        Write-Host "📦 Package ready at: ./deploy"
        Write-Host "✅ Deployment to ${{ matrix.environment }} completed!"